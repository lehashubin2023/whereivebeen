server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Проксирование PHP в контейнер app (PHP-FPM) по имени сервиса
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Буферы под заголовки ответа PHP-FPM: дефолтных 4–8k мало
        # (крупные Set-Cookie / заголовки при APP_DEBUG) → 502 "too big header"
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
    }

    # Запрет доступа к скрытым файлам, кроме ACME-challenge
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
